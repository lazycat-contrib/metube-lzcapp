version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: metube

build:
  toolchains: []
  run_buildscript: false

images:
  - id: metube
    target: service
    service: metube
    source: docker.io/alexta69/metube
    channel: date
    sort: semver
    tag_regex: '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'
    version_regex: '^(?P<version>[0-9]{4})\.(?P<month>[0-9]{2})\.(?P<day>[0-9]{2})$'
    version_template: '{version}.{month}.{day}'
    max_tags: 50000
    max_matching_tags: 50000
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: MeTube
    summary: 自托管视频下载器（yt-dlp 图形界面）
